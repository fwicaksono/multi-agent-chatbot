server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Multi-file uploads (MAX_FILES_PER_UPLOAD x MAX_UPLOAD_MB).
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Docker's embedded DNS. Resolving per request (via the variable below)
    # keeps working when the api container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-Sent Events: stream tokens to the browser immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Long-lived caching for fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: let the client-side router handle deep links.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
