# Multi-Agent RAG Chatbot
#   cp .env.example .env   # add OPENAI_API_KEY (and optionally OPENROUTER_API_KEY)
#   docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:8000/api/docs

name: multi-agent-chatbot

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:-chatbot}@db:5432/${POSTGRES_DB:-chatbot}
  LITELLM_API_BASE: http://litellm:4000
  UPLOAD_DIR: /data/uploads
  EMBEDDED_WORKER: "false"
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  OPENROUTER_APP_URL: http://localhost:8080

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot} -d ${POSTGRES_DB:-chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.1
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-litellm-change-me}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    image: multi-agent-chatbot/backend:local
    restart: unless-stopped
    command: ["api"]
    env_file: .env
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_started

  worker:
    image: multi-agent-chatbot/backend:local
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy  # migrations have been applied

  web:
    build: ./frontend
    image: multi-agent-chatbot/web:local
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
